<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hacim ve Prizmalar Büyük Atölyesi • S.134-143</title>
    <style>
        :root {
            --geo-emerald: #00796b;
            --geo-emerald-dark: #004d40;
            --geo-mint-bg: #e5f7f3;
            --geo-blue: #1565c0;
            --geo-blue-bright: #0d6efd;
            --geo-blue-dark: #0a3d8f;
            --geo-blue-bg: #eaf4ff;
            --geo-orange: #ff7a00;
            --geo-orange-dark: #c25700;
            --geo-yellow: #f5b800;
            --geo-yellow-dark: #b28000;
            --geo-green: #58a728;
            --geo-green-dark: #3b7418;
            --geo-red: #e02424;
            --geo-red-dark: #9b1c1c;
            --dark: #14283c;
            --panel-bg: #ffffff;
            --success: #2e8b22;
            --danger: #e02424;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(180deg, #e2f5f1 0%, #eef6ff 55%, #e6f2fa 100%);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ARKA PLAN FERAH DEKOR */
        .bg-bubbles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .bottom-stripe {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: repeating-linear-gradient(
                90deg,
                rgba(0, 121, 107, 0.1) 0px, rgba(0, 121, 107, 0.1) 24px,
                rgba(21, 101, 192, 0.1) 24px, rgba(21, 101, 192, 0.1) 48px
            );
            border-top: 2px solid rgba(0, 121, 107, 0.18);
            z-index: 0;
            pointer-events: none;
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        /* ÜST HUD (İSİM KUTUSU ORTADA) */
        .top-hud {
            width: calc(100% - 14px);
            max-width: 1360px;
            padding: 5px 0 3px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            z-index: 15;
            flex-shrink: 0;
        }
        .hud-left { grid-column: 1; justify-self: start; display: flex; align-items: center; gap: 6px; }
        .creator-pill {
            grid-column: 2;
            justify-self: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 2.5px solid var(--geo-emerald);
            border-radius: 22px;
            padding: 3px 14px;
            box-shadow: 0 3px 0 rgba(0, 77, 64, 0.2);
        }
        .creator-name { font-weight: 900; font-size: clamp(12.5px, 1.4vw, 15.5px); color: var(--dark); white-space: nowrap; }
        .creator-insta {
            background: linear-gradient(180deg, var(--geo-orange), #e86900);
            color: #fff;
            text-decoration: none;
            font-size: clamp(11px, 1.2vw, 13px);
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 14px;
            box-shadow: 0 2px 0 var(--geo-orange-dark);
            white-space: nowrap;
        }
        .hud-right { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 6px; }
        .hud-chip {
            background: #ffffff;
            color: var(--dark);
            border: 2.5px solid var(--geo-blue);
            border-radius: 14px;
            padding: 3px 11px;
            font-size: clamp(12px, 1.3vw, 14.5px);
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 0 rgba(21, 101, 192, 0.25);
            white-space: nowrap;
        }
        .hud-chip span { color: var(--geo-red); }
        .btn-sound {
            background: #fff;
            color: var(--geo-blue);
            border: 2.5px solid var(--geo-blue);
            border-radius: 11px;
            width: 31px;
            height: 31px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 rgba(21, 101, 192, 0.25);
        }

        /* 10 SAYFA SEKMESİ (S.134 -> S.143) */
        .page-tabs {
            width: calc(100% - 14px);
            max-width: 1360px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 5px;
            z-index: 15;
            flex-shrink: 0;
        }
        .page-tab {
            background: #ffffff;
            border: 2px solid var(--geo-emerald);
            border-radius: 10px;
            padding: 5px 2px;
            font-size: clamp(11px, 1.15vw, 13.5px);
            font-weight: 900;
            color: var(--geo-emerald-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-shadow: 0 3px 0 var(--geo-emerald-dark);
            transition: all 0.14s;
            white-space: nowrap;
        }
        .page-tab.active {
            background: linear-gradient(180deg, #ff8f1f 0%, var(--geo-orange) 100%);
            color: #ffffff;
            border-color: var(--geo-orange-dark);
            box-shadow: 0 3px 0 var(--geo-orange-dark);
        }
        .page-tab.done-p {
            background: var(--geo-green);
            color: #ffffff;
            border-color: var(--geo-green-dark);
            box-shadow: 0 3px 0 var(--geo-green-dark);
        }
        .page-tab.active.done-p {
            background: linear-gradient(180deg, #ff8f1f 0%, var(--geo-orange) 100%);
            border-color: var(--geo-orange-dark);
            box-shadow: 0 3px 0 var(--geo-orange-dark);
        }

        /* ANA OYUN KABUĞU */
        #stage-shell {
            width: calc(100% - 14px);
            max-width: 1360px;
            flex: 1 1 auto;
            min-height: 0;
            margin-bottom: 6px;
            background: var(--panel-bg);
            border: 3.5px solid var(--geo-emerald);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 77, 64, 0.14), 0 4px 0 var(--geo-emerald-dark);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: clamp(26px, 5vw, 58px);
            font-weight: 900;
            color: rgba(0, 121, 107, 0.05);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        .stage-head {
            background: linear-gradient(90deg, var(--geo-emerald) 0%, #0a8d7e 55%, var(--geo-blue) 100%);
            color: #fff;
            padding: 7px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 4px solid var(--geo-yellow);
            flex-shrink: 0;
            z-index: 2;
        }
        .head-title {
            font-size: clamp(14px, 1.55vw, 19px);
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
        }
        #stage-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .page-pill {
            background: var(--geo-red);
            color: #fff;
            font-size: 12.5px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 900;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 0 var(--geo-red-dark);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .head-nav { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .nav-mini {
            background: rgba(255, 255, 255, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.78);
            color: #fff;
            border-radius: 9px;
            padding: 4px 11px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-mini:disabled { opacity: 0.4; cursor: default; }

        .progress-track { width: 100%; height: 6px; background: #d6ebe6; flex-shrink: 0; z-index: 2; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--geo-red), var(--geo-orange), var(--geo-yellow), var(--geo-green)); transition: width 0.3s ease; }

        /* FERAH İÇERİK GÖVDESİ */
        .stage-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: clamp(8px, 1.4vh, 14px) clamp(12px, 1.8vw, 22px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 11px;
            z-index: 2;
        }

        /* SENARYO / SORU KARTI */
        .scenario-card {
            width: 100%;
            max-width: 1140px;
            background: var(--geo-blue-bg);
            border: 2.5px solid var(--geo-blue);
            border-left: 7px solid var(--geo-blue);
            border-radius: 14px;
            padding: 10px 16px;
            box-shadow: 0 3px 8px rgba(21, 101, 192, 0.08);
            flex-shrink: 0;
        }
        .scenario-text {
            font-size: clamp(14.5px, 1.45vw, 17.5px);
            font-weight: 700;
            color: var(--dark);
            line-height: 1.45;
        }
        .scenario-text b { color: var(--geo-blue-dark); font-weight: 900; }

        /* 2 SÜTUNLU FERAH ÇALIŞMA ALANI */
        .workspace-grid {
            width: 100%;
            max-width: 1140px;
            display: grid;
            grid-template-columns: 1.05fr 1.05fr;
            gap: 12px;
            align-items: stretch;
        }
        .model-box {
            background: var(--geo-mint-bg);
            border: 3px solid var(--geo-emerald);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 4px 0 rgba(0, 77, 64, 0.14);
        }
        .right-box {
            background: var(--geo-blue-bg);
            border: 3px solid var(--geo-blue);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 4px 0 rgba(10, 61, 143, 0.14);
        }

        .box-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .pill-title {
            background: var(--geo-emerald);
            color: #fff;
            font-size: clamp(13px, 1.35vw, 15.5px);
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 10px;
            box-shadow: 0 2.5px 0 var(--geo-emerald-dark);
        }
        .pill-stat {
            background: #fff8db;
            border: 2.5px solid var(--geo-yellow-dark);
            color: #7a5200;
            font-size: clamp(13px, 1.35vw, 15.5px);
            font-weight: 900;
            padding: 3px 11px;
            border-radius: 10px;
            white-space: nowrap;
        }

        /* KİTAP TABLOSU */
        .book-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 11px;
            overflow: hidden;
            font-size: clamp(13px, 1.3vw, 15.5px);
            font-weight: 800;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--geo-emerald);
        }
        .book-table th {
            background: var(--geo-emerald);
            color: #fff;
            padding: 7px 8px;
            text-align: center;
        }
        .book-table td {
            background: #ffffff;
            color: var(--dark);
            padding: 7px 8px;
            text-align: center;
            border-top: 1.5px solid #b2dfdb;
        }
        .book-table td.hl-cell { background: #dcfce7; color: var(--geo-green-dark); font-weight: 900; }

        /* 4'LÜ PRİZMA IZGARASI (S.137 SORU 1) */
        .quad-grid {
            width: 100%;
            max-width: 1140px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .mini-prism-card {
            background: #ffffff;
            border: 3px solid var(--geo-blue);
            border-radius: 15px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 rgba(21, 101, 192, 0.22);
        }
        .mini-prism-card.solved {
            border-color: var(--geo-green);
            background: #f0fdf4;
            box-shadow: 0 4px 0 rgba(59, 116, 24, 0.28);
        }

        /* 3'LÜ PRİZMA IZGARASI (S.143 SORU 1 & S.141 KUK 6) */
        .tri-grid {
            width: 100%;
            max-width: 1140px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* ALT SORU KARTLARI */
        .steps-stack {
            width: 100%;
            max-width: 1140px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .sub-step {
            background: #ffffff;
            border: 2.5px solid #90caf9;
            border-radius: 13px;
            padding: 10px 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.25s;
        }
        .sub-step.locked { opacity: 0.45; pointer-events: none; }
        .sub-step.solved { background: #f0fdf4; border-color: var(--geo-green); }
        .sub-q {
            font-size: clamp(14px, 1.45vw, 17px);
            font-weight: 800;
            color: var(--dark);
            line-height: 1.4;
        }

        .choice-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }
        .choice-btn {
            flex: 1 1 130px;
            background: #ffffff;
            border: 2.5px solid var(--geo-blue);
            border-radius: 11px;
            padding: 9px 11px;
            font-size: clamp(13.5px, 1.42vw, 16.5px);
            font-weight: 900;
            color: var(--dark);
            cursor: pointer;
            box-shadow: 0 4px 0 var(--geo-blue-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 5px;
            transition: all 0.12s;
        }
        .choice-btn:hover { background: #e8f2ff; transform: translateY(-1px); }
        .choice-btn:active { transform: translateY(3px); box-shadow: none; }
        .choice-btn.picked-guess { background: #fff8db; border-color: var(--geo-orange); color: #7a4200; box-shadow: 0 4px 0 var(--geo-orange-dark); }
        .choice-btn.correct { background: var(--geo-green); border-color: var(--geo-green-dark); color: #fff; box-shadow: 0 4px 0 var(--geo-green-dark); }
        .choice-btn.wrong { background: var(--geo-red); border-color: var(--geo-red-dark); color: #fff; box-shadow: 0 4px 0 var(--geo-red-dark); animation: shake 0.35s; }

        /* DOĞRU / YANLIŞ SATIRLARI (S.143 SORU 2) */
        .tf-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #ffffff;
            border: 2.5px solid #90caf9;
            border-radius: 13px;
            padding: 9px 14px;
            width: 100%;
        }
        .tf-row.solved { border-color: var(--geo-green); background: #f0fdf4; }
        .tf-text { font-size: clamp(14px, 1.42vw, 16.5px); font-weight: 800; color: var(--dark); line-height: 1.38; flex: 1; }
        .tf-btns { display: flex; gap: 8px; flex-shrink: 0; }
        .tf-btn {
            width: 50px;
            height: 42px;
            border-radius: 10px;
            border: 2.5px solid var(--geo-blue);
            background: #ffffff;
            color: var(--geo-blue-dark);
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 3.5px 0 var(--geo-blue-dark);
        }
        .tf-btn.ok { background: var(--geo-green); border-color: var(--geo-green-dark); color: #fff; box-shadow: 0 3.5px 0 var(--geo-green-dark); pointer-events: none; }
        .tf-btn.err { background: var(--geo-red); border-color: var(--geo-red-dark); color: #fff; animation: shake 0.35s; }

        /* BİLGİ KUTUSU BANNERI (KİTAPTAKİ RESMİ KUTULAR) */
        .book-info-box {
            width: 100%;
            max-width: 1140px;
            background: #fff8db;
            border: 2.5px solid var(--geo-yellow-dark);
            border-left: 7px solid var(--geo-orange);
            border-radius: 13px;
            padding: 10px 15px;
            font-size: clamp(13.5px, 1.38vw, 16px);
            font-weight: 700;
            color: var(--dark);
            line-height: 1.45;
        }
        .book-info-tag {
            display: inline-block;
            background: var(--geo-orange);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 8px;
            margin-bottom: 4px;
        }

        /* KONTROL BUTONLARI (GÖRSELDEKİ TOK 3D KART RENKLERİ) */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-action {
            padding: 8px 15px;
            border: none;
            border-radius: 11px;
            font-size: clamp(13px, 1.35vw, 15.5px);
            font-weight: 900;
            cursor: pointer;
            background: linear-gradient(180deg, #ffca28, var(--geo-yellow));
            color: #3d2800;
            box-shadow: 0 4px 0 var(--geo-yellow-dark);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(3px); box-shadow: none; }
        .btn-action:disabled { opacity: 0.45; cursor: default; transform: none; }
        .btn-action.green { background: linear-gradient(180deg, #68bd34, var(--geo-green)); color: #fff; box-shadow: 0 4px 0 var(--geo-green-dark); }
        .btn-action.teal { background: linear-gradient(180deg, #0a9382, var(--geo-emerald)); color: #fff; box-shadow: 0 4px 0 var(--geo-emerald-dark); }
        .btn-action.pink { background: linear-gradient(180deg, #f03838, var(--geo-red)); color: #fff; box-shadow: 0 4px 0 var(--geo-red-dark); }
        .btn-action.gray { background: linear-gradient(180deg, #1e7be0, var(--geo-blue)); color: #fff; box-shadow: 0 4px 0 var(--geo-blue-dark); }

        /* KONTROLLÜ ALT AKSİYON ÇUBUĞU */
        .post-bar {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            width: 100%;
            margin-top: 2px;
            animation: popIn 0.28s ease;
        }
        .post-bar.visible { display: flex; }

        /* BİLGİ KUTUSU MODALI */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 36, 56, 0.62);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 150;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: #ffffff;
            border: 4px solid var(--geo-emerald);
            border-radius: 22px;
            padding: 22px 20px;
            max-width: 530px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 45px rgba(0, 77, 64, 0.35);
            animation: popIn 0.3s ease;
        }
        .modal-card h3 { color: var(--geo-emerald); font-size: 24px; font-weight: 900; margin-bottom: 10px; }
        .modal-card p { color: var(--dark); font-size: 16.5px; font-weight: 700; line-height: 1.55; margin-bottom: 18px; }
        .modal-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

        /* TOAST */
        #toast {
            position: fixed;
            top: 54px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            opacity: 0;
            pointer-events: none;
            z-index: 160;
            background: var(--geo-blue);
            border: 2.5px solid var(--geo-yellow);
            color: #fff;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: clamp(13.5px, 1.5vw, 15.5px);
            font-weight: 800;
            box-shadow: 0 8px 22px rgba(10, 61, 143, 0.32);
            transition: all 0.25s ease;
            text-align: center;
            max-width: 90vw;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.ok { background: var(--geo-green); border-color: #ffffff; }
        #toast.err { background: var(--geo-red); border-color: #ffedd5; }

        @keyframes popIn { 0% { transform: scale(0.86); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        @media (max-width: 900px) {
            .workspace-grid, .quad-grid, .tri-grid { grid-template-columns: 1fr; }
            .page-tabs { grid-template-columns: repeat(5, 1fr); }
        }
        @media (max-width: 680px) {
            .top-hud { grid-template-columns: 1fr 1fr; row-gap: 4px; }
            .creator-pill { grid-column: 1 / -1; grid-row: 1; }
            .hud-left { grid-column: 1; grid-row: 2; }
            .hud-right { grid-column: 2; grid-row: 2; }
            .tf-row { flex-direction: column; align-items: flex-start; }
            .tf-btns { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <svg class="bg-bubbles" viewBox="0 0 1200 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <g opacity="0.28">

    <script>
        // ==========================================
        // NEŞELİ SES MOTORU (WEB AUDIO API)
        // ==========================================
        let audioCtx = null;
        let soundOn = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        document.getElementById('sound-btn').addEventListener('click', () => {
            soundOn = !soundOn;
            document.getElementById('sound-btn').innerText = soundOn ? '🔊' : '🔇';
        });

        function playSound(type) {
            if (!soundOn) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                if (type === 'fanfare') {
                    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(f, now + i * 0.075);
                        g.gain.setValueAtTime(0.22, now + i * 0.075);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.075 + 0.28);
                        o.start(now + i * 0.075); o.stop(now + i * 0.075 + 0.29);
                    });
                    return;
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.09);
                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.11);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'tick') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(540, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.045);
                    gain.gain.setValueAtTime(0.11, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.055);
                    osc.start(now); osc.stop(now + 0.06);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.26);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(210, now);
                    osc.frequency.linearRampToValueAtTime(130, now + 0.24);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
                    osc.start(now); osc.stop(now + 0.27);
                }
            } catch (e) {}
        }

        function fmtInt(n) {
            return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        // ==========================================
        // ORTAK 3D İZOMETRİK PRİZMA & KÜP SVG MOTORU
        // ==========================================
        function buildIsoBoxSVG(nx, ny, nz, opts = {}) {
            const {
                colors = { top: '#38bdf8', left: '#0ea5e9', right: '#0284c7', stroke: '#0f172a' },
                mode = 'full', // 'full' | 'layers_y' | 'layers_x' | 'layers_z' | 'skeleton_plus_col' | 'balls'
                filled = ny,
                unit = 16,
                showWireframe = true,
                labels = null, // { x, y, z }
                viewW = 280,
                viewH = 200
            } = opts;

            const dx = unit * 0.92;
            const dy = unit * 0.46;
            const dh = unit * 0.95;

            // Prizmayı merkeze oturt
            const ox = viewW / 2 + (nz - nx) * dx * 0.5;
            const oy = viewH / 2 + (ny * dh - (nx + nz) * dy) * 0.42 + 12;

            const proj = (x, y, z) => [
                ox + (x - z) * dx,
                oy + (x + z) * dy - y * dh
            ];
            const pt = (x, y, z) => proj(x, y, z).map(v => v.toFixed(1)).join(',');

            const drawCube = (x, y, z, col = colors) => {
                const pTop = `${pt(x, y + 1, z)} ${pt(x + 1, y + 1, z)} ${pt(x + 1, y + 1, z + 1)} ${pt(x, y + 1, z + 1)}`;
                const pLeft = `${pt(x, y + 1, z + 1)} ${pt(x + 1, y + 1, z + 1)} ${pt(x + 1, y, z + 1)} ${pt(x, y, z + 1)}`;
                const pRight = `${pt(x + 1, y + 1, z + 1)} ${pt(x + 1, y + 1, z)} ${pt(x + 1, y, z)} ${pt(x + 1, y, z + 1)}`;
                return `
                    <polygon points="${pLeft}" fill="${col.left}" stroke="${col.stroke}" stroke-width="1.15" stroke-linejoin="round"/>
                    <polygon points="${pRight}" fill="${col.right}" stroke="${col.stroke}" stroke-width="1.15" stroke-linejoin="round"/>
                    <polygon points="${pTop}" fill="${col.top}" stroke="${col.stroke}" stroke-width="1.15" stroke-linejoin="round"/>
                `;
            };

            let svg = `<svg viewBox="0 0 ${viewW} ${viewH}" style="width:100%; max-width:${viewW}px; height:auto; display:block;" xmlns="http://www.w3.org/2000/svg">`;

            // Arka şeffaf tel kafes
            if (showWireframe) {
                svg += `<polygon points="${pt(0,0,0)} ${pt(nx,0,0)} ${pt(nx,ny,0)} ${pt(0,ny,0)}" fill="rgba(226,232,240,0.45)" stroke="#64748b" stroke-width="1.3"/>`;
                svg += `<polygon points="${pt(0,0,0)} ${pt(0,0,nz)} ${pt(0,ny,nz)} ${pt(0,ny,0)}" fill="rgba(203,213,225,0.45)" stroke="#64748b" stroke-width="1.3"/>`;
                svg += `<polygon points="${pt(0,0,0)} ${pt(nx,0,0)} ${pt(nx,0,nz)} ${pt(0,0,nz)}" fill="rgba(241,245,249,0.55)" stroke="#64748b" stroke-width="1.3"/>`;
            }

            // Küpleri veya topları arkadan öne doğru çiz (painter's algorithm)
            if (mode === 'balls') {
                let drawn = 0;
                for (let y = 0; y < ny; y++) {
                    for (let z = 0; z < nz; z++) {
                        for (let x = 0; x < nx; x++) {
                            if (drawn >= filled) break;
                            const [cx, cy] = proj(x + 0.5, y + 0.5, z + 0.5);
                            const r = unit * 0.48;
                            svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="#fb923c" stroke="#9a3412" stroke-width="1.2"/>`;
                            svg += `<circle cx="${(cx - r * 0.28).toFixed(1)}" cy="${(cy - r * 0.28).toFixed(1)}" r="${(r * 0.28).toFixed(1)}" fill="#ffedd5" opacity="0.75"/>`;
                            drawn++;
                        }
                    }
                }
            } else {
                for (let y = 0; y < ny; y++) {
                    for (let z = 0; z < nz; z++) {
                        for (let x = 0; x < nx; x++) {
                            let show = false;
                            if (mode === 'full') show = true;
                            else if (mode === 'layers_y') show = (y < filled);
                            else if (mode === 'layers_x') show = (x < filled);
                            else if (mode === 'layers_z') show = (z < filled);
                            else if (mode === 'skeleton_plus_col') {
                                // Taban + 1 köşe sütunu (S.137 Soru 1 ilk hâli)
                                show = (y === 0) || (x === 0 && z === 0) || (y < filled);
                            }
                            if (show) svg += drawCube(x, y, z);
                        }
                    }
                }
            }

            // Ön şeffaf tel kafes
            if (showWireframe) {
                svg += `<polyline points="${pt(0,ny,0)} ${pt(nx,ny,0)} ${pt(nx,ny,nz)} ${pt(0,ny,nz)} ${pt(0,ny,0)}" fill="none" stroke="#1e293b" stroke-width="1.6"/>`;
                svg += `<line x1="${proj(nx,0,nz)[0]}" y1="${proj(nx,0,nz)[1]}" x2="${proj(nx,ny,nz)[0]}" y2="${proj(nx,ny,nz)[1]}" stroke="#1e293b" stroke-width="1.6"/>`;
                svg += `<line x1="${proj(0,0,nz)[0]}" y1="${proj(0,0,nz)[1]}" x2="${proj(0,ny,nz)[0]}" y2="${proj(0,ny,nz)[1]}" stroke="#1e293b" stroke-width="1.4"/>`;
                svg += `<line x1="${proj(nx,0,0)[0]}" y1="${proj(nx,0,0)[1]}" x2="${proj(nx,ny,0)[0]}" y2="${proj(nx,ny,0)[1]}" stroke="#1e293b" stroke-width="1.4"/>`;
                svg += `<polyline points="${pt(0,0,nz)} ${pt(nx,0,nz)} ${pt(nx,0,0)}" fill="none" stroke="#1e293b" stroke-width="1.6"/>`;
            }

            // Ayrıt etiketleri
            if (labels) {
                if (labels.x) {
                    const p = proj(nx / 2, 0, nz + 0.55);
                    svg += `<text x="${p[0]}" y="${p[1] + 6}" text-anchor="middle" font-size="12.5" font-weight="900" fill="#0f172a">${labels.x}</text>`;
                }
                if (labels.z) {
                    const p = proj(nx + 0.65, 0, nz / 2);
                    svg += `<text x="${p[0] + 4}" y="${p[1] + 5}" text-anchor="start" font-size="12.5" font-weight="900" fill="#0f172a">${labels.z}</text>`;
                }
                if (labels.y) {
                    const p = proj(nx + 0.55, ny / 2, 0);
                    svg += `<text x="${p[0] + 6}" y="${p[1] + 4}" text-anchor="start" font-size="12.5" font-weight="900" fill="#b91c1c">${labels.y}</text>`;
                }
            }

            svg += `</svg>`;
            return svg;
        }

        // ==========================================
        // 17 ADIMLIK TAM VERİTABANI (S.134 → S.143 EKSİKSİZ)
        // ==========================================
        const STEPS = [
            { id: 's134', page: 134, title: 'Katıl-Uygula-Keşfet 4 • Kutuların Kapasitelerini Karşılaştırma' },
            { id: 's135_dta4', page: 135, title: 'Düşün-Tartış-Açıkla 4 • Alper\'in Makarna Kutuları' },
            { id: 's135_dta5', page: 135, title: 'Düşün-Tartış-Açıkla 5 • Tuğla Depoları (Depo 1 & Depo 2)' },
            { id: 's136_dta6', page: 136, title: 'Düşün-Tartış-Açıkla 6 • Ali ve Filiz\'in Ahşap Denge Kuleleri' },
            { id: 's137_q1', page: 137, title: 'Neler Öğrendik? • Soru 1 (a, b, c, ç Prizma Hacimleri)' },
            { id: 's137_q2', page: 137, title: 'Neler Öğrendik? • Soru 2 (2 br\'lik 10 Eş Küp)' },
            { id: 's137_q3', page: 137, title: 'Neler Öğrendik? • Soru 3 (a & b • Eczane İlaç Rafı)' },
            { id: 's138_dta7', page: 138, title: 'Düşün-Tartış-Açıkla 7 • Cam Kap ve Birim Küp' },
            { id: 's138_uyg2', page: 138, title: 'Uygulayalım 2 • Birim Küplerle Hacim Bulma (a & b)' },
            { id: 's139_dta8', page: 139, title: 'Düşün-Tartış-Açıkla 8 • Ahmet, Ceren ve Mehmet\'in Yöntemleri' },
            { id: 's140_dta8', page: 140, title: 'DTA 8 Soru 5 • Hacim Bağıntısı & Bilgi Kutusu' },
            { id: 's141_kuk5', page: 141, title: 'Katıl-Uygula-Keşfet 5 • 18 Eş Küple Farklı Prizmalar' },
            { id: 's141_kuk6', page: 141, title: 'Katıl-Uygula-Keşfet 6 • Farklı Görünümlerde Eşit Hacimli Yapılar' },
            { id: 's142_dta9', page: 142, title: 'Düşün-Tartış-Açıkla 9 • Doruk (Kare Prizma) ve Emel (Küp)' },
            { id: 's143_q1', page: 143, title: 'Neler Öğrendik? • Soru 1 (a, b, c Prizma Hacimleri)' },
            { id: 's143_q2', page: 143, title: 'Neler Öğrendik? • Soru 2 (Doğru / Yanlış Değerlendirme)' },
            { id: 's143_q3', page: 143, title: 'Neler Öğrendik? • Soru 3 (Kesilmiş Dikdörtgenler Prizması)' }
        ];

        const PAGES = [134, 135, 136, 137, 138, 139, 140, 141, 142, 143];

        // ==========================================
        // OYUN DURUMU
        // ==========================================
        let currentIdx = 0;
        let score = 0;
        let stepSolved = Array(STEPS.length).fill(false);
        let currentModalNote = '';

        // Adım bazlı etkileşim durumları
        const S = {
            // S.134
            p134Guess: null,
            p134Q2: false,
            p134FillMode: 'cubes', // 'cubes' | 'balls'
            p134Box1Cubes: false, p134Box2Cubes: false,
            p134Box1Balls: false, p134Box2Balls: false,
            p134Q4: false,
            // S.135 DTA 4
            p135PastaZoom: false,
            p135Dta4Ans: false,
            // S.135 DTA 5
            depo1Layers: 1, depo2Layers: 1,
            p135Dta5Q1: false, p135Dta5Q2: false,
            // S.136 DTA 6
            aliLayers: 1, filizLayers: 1,
            p136Q: false,
            // S.137 Q1
            q1Fill: [1, 1, 1, 1],
            q1Done: [false, false, false, false],
            // S.137 Q2
            q2View: 0, // 0: 1x1x10 (2x2x20), 1: 1x2x5 (2x4x10)
            q2VolDone: false, q2EdgeDone: false,
            // S.137 Q3
            q3Fill: 1,
            q3aDone: false, q3bDone: false,
            // S.138 DTA 7
            camView: 1, // 1, 2, 3
            dta7a: false, dta7b: false,
            // S.138 UYG 2
            uyg2aLayer: 1, uyg2bLayer: 1,
            uyg2aDone: false, uyg2bDone: false,
            // S.139 DTA 8
            dta8Method: 'ahmet', // ahmet | ceren | mehmet
            dta8Fill: 1,
            dta8Q1: false, dta8Q2: false, dta8Q3: false, dta8Q4: false,
            // S.140
            s140Highlighted: false,
            s140Q5: false, s140NoteQ: false,
            // S.141 KUK 5
            kuk5Active: 0,
            kuk5Seen: [true, false, false, false],
            kuk5a: false, kuk5b: false,
            // S.141 KUK 6
            kuk6a: false, kuk6b: false,
            // S.142 DTA 9
            dorukLayers: 1, emelLayers: 1,
            dta9Q1: false, dta9Q2: false,
            // S.143 Q1
            s143q1Done: [false, false, false],
            // S.143 Q2
            s143q2Done: [false, false, false, false, false],
            // S.143 Q3
            s143q3Vol: false,
            s143q3Found: [] // '1-6-6', '2-3-6', '3-3-4'
        };

        function buildPageTabs() {
            const bar = document.getElementById('page-tabs');
            bar.innerHTML = '';
            PAGES.forEach(p => {
                const firstStepIdx = STEPS.findIndex(st => st.page === p);
                const pageSteps = STEPS.map((st, idx) => ({ st, idx })).filter(x => x.st.page === p);
                const allDone = pageSteps.every(x => stepSolved[x.idx]);
                const isAct = STEPS[currentIdx].page === p;
                const btn = document.createElement('button');
                btn.className = `page-tab ${isAct ? 'active' : ''} ${allDone ? 'done-p' : ''}`;
                btn.innerHTML = `S.${p}${allDone ? ' ✓' : ''}`;
                btn.onclick = () => jumpStep(firstStepIdx);
                bar.appendChild(btn);
            });
        }

        function updateHUD() {
            const st = STEPS[currentIdx];
            document.getElementById('hud-step').innerText = `${currentIdx + 1}/${STEPS.length}`;
            document.getElementById('hud-score').innerText = score;
            document.getElementById('stage-title').innerText = st.title;
            document.getElementById('stage-page').innerText = `Sayfa ${st.page}`;

            const doneCnt = stepSolved.filter(Boolean).length;
            document.getElementById('progress-bar').style.width = `${(doneCnt / STEPS.length) * 100}%`;

            document.getElementById('btn-prev').disabled = (currentIdx === 0);
            document.getElementById('btn-next').disabled = (currentIdx === STEPS.length - 1);
            buildPageTabs();
        }

        function jumpStep(idx) {
            initAudio();
            playSound('tick');
            currentIdx = Math.max(0, Math.min(STEPS.length - 1, idx));
            renderStep(true);
        }
        function prevStep() { if (currentIdx > 0) jumpStep(currentIdx - 1); }
        function nextStep() {
            if (currentIdx < STEPS.length - 1) jumpStep(currentIdx + 1);
            else showFinalCelebration();
        }

        function renderStep(scrollToTop = false) {
            updateHUD();
            const st = STEPS[currentIdx];
            const body = document.getElementById('stage-body');
            const prevScroll = body.scrollTop;
            body.innerHTML = '';

            switch (st.id) {
                case 's134': renderS134(body); break;
                case 's135_dta4': renderS135Dta4(body); break;
                case 's135_dta5': renderS135Dta5(body); break;
                case 's136_dta6': renderS136Dta6(body); break;
                case 's137_q1': renderS137Q1(body); break;
                case 's137_q2': renderS137Q2(body); break;
                case 's137_q3': renderS137Q3(body); break;
                case 's138_dta7': renderS138Dta7(body); break;
                case 's138_uyg2': renderS138Uyg2(body); break;
                case 's139_dta8': renderS139Dta8(body); break;
                case 's140_dta8': renderS140Dta8(body); break;
                case 's141_kuk5': renderS141Kuk5(body); break;
                case 's141_kuk6': renderS141Kuk6(body); break;
                case 's142_dta9': renderS142Dta9(body); break;
                case 's143_q1': renderS143Q1(body); break;
                case 's143_q2': renderS143Q2(body); break;
                case 's143_q3': renderS143Q3(body); break;
            }
            body.scrollTop = scrollToTop ? 0 : prevScroll;
        }

        // ==========================================
        // ADIM 1: SAYFA 134 (KATIL-UYGULA-KEŞFET 4)
        // ==========================================
        function renderS134(body) {
            const allFilled = S.p134Box1Cubes && S.p134Box2Cubes && S.p134Box1Balls && S.p134Box2Balls;
            const isCubes = S.p134FillMode === 'cubes';

            const box1Svg = buildIsoBoxSVG(4, 2, 3, {
                mode: isCubes ? 'layers_y' : 'balls',
                filled: isCubes ? (S.p134Box1Cubes ? 2 : 0) : (S.p134Box1Balls ? 12 : 0),
                unit: 18, viewW: 210, viewH: 150,
                colors: { top: '#38bdf8', left: '#0ea5e9', right: '#0284c7', stroke: '#0f172a' }
            });
            const box2Svg = buildIsoBoxSVG(3, 2, 3, {
                mode: isCubes ? 'layers_y' : 'balls',
                filled: isCubes ? (S.p134Box2Cubes ? 2 : 0) : (S.p134Box2Balls ? 9 : 0),
                unit: 18, viewW: 210, viewH: 150,
                colors: { top: '#f472b6', left: '#ec4899', right: '#db2777', stroke: '#0f172a' }
            });

            body.innerHTML = `
                <div class="scenario-card">
                    <div class="scenario-text">
                        📦 <b>Katıl-Uygula-Keşfet 4 (Sayfa 134):</b> Benzer büyüklüklere sahip dikdörtgen prizması şeklinde iki adet kutu (<b>1. Kutu: Parfüm Kutusu</b>, <b>2. Kutu: İlaç Kutusu</b>), çok sayıda <b>sayı küpü</b> ve <b>pinpon topu</b> ile kapasite karşılaştırması yapalım!
                    </div>
                </div>
                <div class="workspace-grid">
                    <div class="model-box">
                        <div class="box-header">
                            <span class="pill-title">🧪 Canlı Kutu Doldurma Deneyi</span>
                            <div style="display:flex; gap:5px;">
                                <button class="btn-action ${isCubes ? 'teal' : 'gray'}" style="padding:5px 10px; font-size:12.5px;" onclick="setS134Mode('cubes')">🧊 Sayı Küpü</button>

        // ==========================================
        // ADIM 4: SAYFA 136 • DTA 6 (ALİ VE FİLİZ DENGE KULELERİ)
        // ==========================================
        function buildJengaTowerSVG(perLayer, layers, maxLayers, label) {
            let svg = `<svg viewBox="0 0 180 200" style="width:100%; max-width:175px; height:auto; display:block;" xmlns="http://www.w3.org/2000/svg">`;
            const baseY = 178;
            const lh = 11.5;
            for (let i = 0; i < layers; i++) {
                const y = baseY - (i + 1) * lh;
                const alt = i % 2 === 0;
                const w = perLayer === 4 ? 76 : 68;
                const x = (180 - w) / 2;
                // Ön yüz
                svg += `<rect x="${x}" y="${y}" width="${w}" height="${lh}" fill="${alt ? '#e5b877' : '#d6a156'}" stroke="#78350f" stroke-width="1"/>`;
                // Parça bölümleri (ön yüz)
                if (alt) {
                    for (let k = 1; k < perLayer; k++) {
                        const dx = x + (w / perLayer) * k;
                        svg += `<line x1="${dx}" y1="${y}" x2="${dx}" y2="${y + lh}" stroke="#78350f" stroke-width="1"/>`;
                    }
                }
                // Sağ yan 3D perspektif yüzü
                svg += `<polygon points="${x + w},${y} ${x + w + 18},${y - 8} ${x + w + 18},${y + lh - 8} ${x + w},${y + lh}" fill="${alt ? '#b9833a' : '#c99347'}" stroke="#78350f" stroke-width="1"/>`;
                if (i === layers - 1) {
                    // Üst kapak
                    svg += `<polygon points="${x},${y} ${x + 18},${y - 8} ${x + w + 18},${y - 8} ${x + w},${y}" fill="#f3d19c" stroke="#78350f" stroke-width="1"/>`;
                }
            }
            svg += `<text x="90" y="195" text-anchor="middle" font-size="12" font-weight="900" fill="#78350f">${label}: ${layers}×${perLayer} = ${layers * perLayer} parça</text>`;
            svg += `</svg>`;
            return svg;
        }

            return s;

                                </div>
                            </div>
                            <div class="sub-step ${!S.s143q3Vol ? 'locked' : ''} ${foundAll ? 'solved' : ''}">
                                <div class="sub-q">2) Çarpımı <b>36</b> olan ve <b>8, 7, 5</b> ayrıtlı prizmanın içinden kesilebilecek <b>3 doğru ayrıt üçlüsünü</b> seçip tabloya yerleştir (${S.s143q3Found.length}/3):</div>
                                <div class="choice-row">
                                    ${candidates.map(c => `
                                        <button class="choice-btn ${S.s143q3Found.includes(c.id) ? 'correct' : ''}" onclick="pickCutTriple('${c.id}', ${c.ok}, '${c.why || ''}', this)">${c.txt}</button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="post-bar ${stepSolved[currentIdx] ? 'visible' : ''}" id="post-bar"></div>
                    </div>
                </div>
            `;
            if (stepSolved[currentIdx]) showPostBar('🏆 Muhteşem! Kesilen parçanın hacmi <b>36 br³</b>\'tür. Ayrıtları 8, 7 ve 5\'ten küçük olacağı için 3 olası durum vardır: <b>(1, 6, 6)</b>, <b>(2, 3, 6)</b> ve <b>(3, 3, 4)</b>!');
        }

        function checkS143Q3Vol(ok, btn) {
            initAudio(); if (S.s143q3Vol) return;
            if (ok) { S.s143q3Vol = true; score += 25; playSound('correct'); launchConfetti('mini'); renderStep(); }
            else { playSound('wrong'); btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 380); showToast('✖ 280 - 244 çıkarma işlemini tekrar yapalım!', 'err'); }
        }

        function pickCutTriple(id, ok, why, btn) {
            initAudio();
            if (S.s143q3Found.includes(id)) return;
            if (ok) {
                S.s143q3Found.push(id);
                score += 20;
                if (S.s143q3Found.length === 3) {
                    completeStep('🏆 Muhteşem! Sayfa 134\'ten 143\'e kadar olan tüm <b>Hacim ve Prizmalar</b> sorularını eksiksiz tamamladın!');
                } else {
                    playSound('correct'); launchConfetti('mini');
                }
                renderStep();
            } else {
                playSound('wrong'); btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 380);
                showToast(`✖ ${why}`, 'err');
            }
        }

        // ==========================================
        // TAMAMLANMA & KONTROLLÜ BİLGİ KUTUSU
        // ==========================================
        function completeStep(noteHtml) {
            if (!stepSolved[currentIdx]) {
                stepSolved[currentIdx] = true;
                score += 50;
            }
            playSound('fanfare');
            launchConfetti('big');
            updateHUD();
            showPostBar(noteHtml);
        }

        function showPostBar(noteHtml) {
            currentModalNote = noteHtml;
            const bar = document.getElementById('post-bar');
            if (!bar) return;
            const isLast = (currentIdx === STEPS.length - 1);
            bar.innerHTML = `
                <button class="btn-action" onclick="openInfoModal()">💡 Bilgi Kutusunu Aç</button>
                <button class="btn-action pink" onclick="nextStep()">${isLast ? '🏆 Büyük Atölyeyi Tamamla' : 'Sonraki Adım ➡️'}</button>
            `;
            bar.classList.add('visible');
        }

        function openInfoModal() {
            playSound('tick');
            document.getElementById('info-modal-text').innerHTML = currentModalNote;
            const nextBtn = document.getElementById('info-modal-next');
            nextBtn.innerText = currentIdx === STEPS.length - 1 ? '🏆 Büyük Atölyeyi Tamamla' : 'Sonraki Adım ➡️';
            nextBtn.onclick = () => { closeInfoModal(); nextStep(); };
            document.getElementById('info-modal').classList.add('open');
        }

        function closeInfoModal() {
            playSound('tick');
            document.getElementById('info-modal').classList.remove('open');
        }

        function showFinalCelebration() {
            playSound('fanfare');
            launchConfetti('big');
            document.getElementById('info-modal-text').innerHTML = `
                <b>Tebrikler! 🏆🧊🎉</b><br><br>
                <b>Sayfa 134'ten 143'e</b> kadar olan tüm hacim etkinliklerini, 3D prizma modellemelerini ve değerlendirme sorularını eksiksiz tamamladın!<br><br>
                Toplam Puanın: <b>${score} ⭐</b>
            `;
            const nextBtn = document.getElementById('info-modal-next');
            nextBtn.innerText = '🔄 Baştan Oyna';
            nextBtn.onclick = () => location.reload();
            document.getElementById('info-modal').classList.add('open');
        }

        // ==========================================
        // TOAST & BOLCA KONFETİ
        // ==========================================
        let toastTimer = null;
        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.className = 'show' + (type ? ' ' + type : '');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
        }

        const cCanvas = document.getElementById('confetti-canvas');
        const cCtx = cCanvas.getContext('2d');
        let confetti = [];
        let animId = null;

        function launchConfetti(size) {
            cCanvas.width = window.innerWidth;
            cCanvas.height = window.innerHeight;
            const colors = ['#e02424', '#ff7a00', '#f5b800', '#58a728', '#00796b', '#0d6efd'];
            const count = size === 'big' ? 125 : 22;
            for (let i = 0; i < count; i++) {
                confetti.push({
                    x: cCanvas.width * (size === 'big' ? (0.2 + Math.random() * 0.6) : 0.5),
                    y: cCanvas.height * 0.45,
                    vx: (Math.random() - 0.5) * 21,
                    vy: -(Math.random() * 14 + 5),
                    r: Math.random() * 5.5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1
                });
            }
            if (!animId) animateConfetti();
        }

        function animateConfetti() {
            cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
            confetti = confetti.filter(p => p.life > 0);
            confetti.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45;
                p.life -= 0.017;
                cCtx.globalAlpha = Math.max(0, p.life);
                cCtx.fillStyle = p.color;
                cCtx.fillRect(p.x, p.y, p.r * 1.5, p.r);
            });
            cCtx.globalAlpha = 1;
            if (confetti.length > 0) animId = requestAnimationFrame(animateConfetti);
            else { cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height); animId = null; }
        }

        window.onload = function () {
            renderStep(true);
        };
    </script>
</body>
</html>
